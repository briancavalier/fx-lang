[workspace]
members = [
  "crates/fx-syntax",
  "crates/fx-core",
  "crates/fx-compiler",
  "crates/fx-cli",
  "crates/fx-lsp",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
fx-syntax = { path = "crates/fx-syntax" }
fx-core = { path = "crates/fx-core" }
fx-compiler = { path = "crates/fx-compiler" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync"] }
tower-lsp = "0.20"
walkdir = "2"
